name: RSS to Notion

on:
  schedule:
    - cron: '0 22 * * 0'
  workflow_dispatch:     # 手動でのトリガーも有効化

jobs:
  rss-notion:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      # Step 1: RSS記事を収集してJSON出力
      - name: Collect RSS articles
        run: node scripts/collect-articles.js
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          FEEDER_DB_ID: ${{ secrets.FEEDER_DB_ID }}
          READER_DB_ID: ${{ secrets.READER_DB_ID }}

      # 収集した記事がなければ終了
      - name: Check if articles exist
        id: check_articles
        run: |
          if [ ! -f articles.json ] || [ "$(cat articles.json)" = "[]" ]; then
            echo "has_articles=false" >> $GITHUB_OUTPUT
            echo "No articles to filter"
          else
            echo "has_articles=true" >> $GITHUB_OUTPUT
            echo "Articles found: $(cat articles.json | jq length)"
          fi

      # Step 2: ローカルルールでフィルタリング（AI非依存）
      - name: Filter articles locally
        if: steps.check_articles.outputs.has_articles == 'true'
        run: node scripts/filter-articles-local.js

      - name: Validate filtered-articles.json
        if: steps.check_articles.outputs.has_articles == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f filtered-articles.json ]; then
            echo "::error::filtered-articles.json was not generated"
            echo "[INFO] Workspace files:"
            ls -la
            exit 1
          fi
          python3 -m json.tool filtered-articles.json > /dev/null
          jq -e 'type == "array"' filtered-articles.json > /dev/null
          echo "[INFO] filtered-articles.json is valid JSON array"

      # Step 3: フィルタ済み記事をNotionに保存
      - name: Store filtered articles to Notion
        if: steps.check_articles.outputs.has_articles == 'true'
        run: node scripts/store-to-notion.js
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          READER_DB_ID: ${{ secrets.READER_DB_ID }}

      # サマリー表示
      - name: Show summary
        if: always()
        run: |
          echo "=== RSS to Notion Summary ==="
          if [ -f articles.json ]; then
            echo "Collected articles: $(cat articles.json | jq length)"
          else
            echo "Collected articles: 0"
          fi
          if [ -f filtered-articles.json ]; then
            if jq -e . filtered-articles.json >/dev/null 2>&1; then
              echo "Filtered articles (score >= 40): $(cat filtered-articles.json | jq length)"
            else
              echo "Filtered articles: (filtered-articles.json is invalid JSON)"
            fi
          else
            echo "Filtered articles: (filtered-articles.json not found)"
          fi
