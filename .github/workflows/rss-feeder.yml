name: RSS to Notion

on:
  schedule:
    - cron: '0 22 * * 0'
  workflow_dispatch:     # 手動でのトリガーも有効化

jobs:
  rss-notion:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      # Step 1: RSS記事を収集してJSON出力
      - name: Collect RSS articles
        run: node scripts/collect-articles.js
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          FEEDER_DB_ID: ${{ secrets.FEEDER_DB_ID }}
          READER_DB_ID: ${{ secrets.READER_DB_ID }}

      # 収集した記事がなければ終了
      - name: Check if articles exist
        id: check_articles
        run: |
          if [ ! -f articles.json ] || [ "$(cat articles.json)" = "[]" ]; then
            echo "has_articles=false" >> $GITHUB_OUTPUT
            echo "No articles to filter"
          else
            echo "has_articles=true" >> $GITHUB_OUTPUT
            echo "Articles found: $(cat articles.json | jq length)"
          fi

      # Step 2: Claude でフィルタリング（GitHub App経由で認証）
      - name: Filter articles with Claude
        id: filter_articles
        if: steps.check_articles.outputs.has_articles == 'true'
        continue-on-error: true
        timeout-minutes: 6
        uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ github.token }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: github-actions
          show_full_output: false
          claude_args: |
            --allowedTools Read,Glob
            --max-turns 60
            --json-schema '{"type":"object","properties":{"filtered_articles":{"type":"array","items":{"type":"object","properties":{"title":{"type":"string"},"link":{"type":"string"},"ai_status":{"type":"string"},"ai_score":{"type":"number"},"ai_reason":{"type":"string"},"publishedAt":{"type":"string"},"description":{"type":"string"},"domain":{"type":"string"},"ogpImages":{"type":"array","items":{"type":"string"}}},"required":["link","ai_status","ai_score","ai_reason"]}}},"required":["filtered_articles"]}'
          prompt: |
            以下のタスクを実行してください：

            1. articles.json を読み込む
            2. scripts/filter-prompt.md のガイドラインに従って各記事を評価
            3. スコア40以上（推奨+保留）の記事のみを選別
            4. 各記事に ai_status, ai_score, ai_reason を付与
            5. 以降の「出力形式」に従って structured output（JSON）を返す

            重要:
            - ファイル書き込みはしないでください（filtered-articles.json は後続ステップで作ります）。
            - 対象が0件の場合でも、filtered_articles は必ず空配列 [] を返してください。
            - 出力は必ず JSON スキーマに準拠させてください。
            - 出力は最小限にしてください（推奨: title/link/ai_* のみ。publishedAt/description/domain/ogpImages は省略してOK）。

            出力形式（必須）:
            {
              "filtered_articles": [
                {
                  "title": "記事タイトル（任意だが推奨）",
                  "link": "https://...",
                  "ai_status": "推奨|保留",
                  "ai_score": 75,
                  "ai_reason": "[推奨] ...（日本語で簡潔に）"
                }
              ]
            }

      - name: Build filtered-articles.json from structured output
        if: steps.check_articles.outputs.has_articles == 'true' && steps.filter_articles.outcome == 'success'
        env:
          STRUCTURED_OUTPUT: ${{ steps.filter_articles.outputs.structured_output }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          structured = json.loads(os.environ.get("STRUCTURED_OUTPUT", "") or "{}")
          filtered = structured.get("filtered_articles", [])

          if not isinstance(filtered, list):
            raise SystemExit("::error::structured_output.filtered_articles must be an array")

          articles = json.loads(Path("articles.json").read_text(encoding="utf-8"))
          by_link = {}
          if isinstance(articles, list):
            for a in articles:
              link = (a or {}).get("link")
              if isinstance(link, str) and link:
                by_link[link] = a

          merged = []
          seen = set()
          for item in filtered:
            if not isinstance(item, dict):
              continue
            link = item.get("link")
            if not isinstance(link, str) or not link:
              continue
            if link in seen:
              continue
            seen.add(link)
            base = by_link.get(link, {})
            if not isinstance(base, dict):
              base = {}
            m = {}
            m.update(base)
            m.update(item)
            if not m.get("title") and isinstance(base, dict) and base.get("title"):
              m["title"] = base.get("title")
            merged.append(m)

          Path("filtered-articles.json").write_text(
            json.dumps(merged, ensure_ascii=False, indent=2) + "\n",
            encoding="utf-8",
          )
          print(f"[INFO] Wrote filtered-articles.json: {len(merged)} articles")
          PY

      - name: Filter articles locally (fallback)
        if: steps.check_articles.outputs.has_articles == 'true' && steps.filter_articles.outcome != 'success'
        run: node scripts/filter-articles-local.js

      - name: Validate filtered-articles.json
        if: steps.check_articles.outputs.has_articles == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f filtered-articles.json ]; then
            echo "::error::filtered-articles.json was not generated"
            echo "[INFO] Workspace files:"
            ls -la
            exit 1
          fi
          python3 -m json.tool filtered-articles.json > /dev/null
          jq -e 'type == "array"' filtered-articles.json > /dev/null
          echo "[INFO] filtered-articles.json is valid JSON array"

      # Step 3: フィルタ済み記事をNotionに保存
      - name: Store filtered articles to Notion
        if: steps.check_articles.outputs.has_articles == 'true'
        run: node scripts/store-to-notion.js
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          READER_DB_ID: ${{ secrets.READER_DB_ID }}

      # サマリー表示
      - name: Show summary
        if: always()
        run: |
          echo "=== RSS to Notion Summary ==="
          if [ -f articles.json ]; then
            echo "Collected articles: $(cat articles.json | jq length)"
          else
            echo "Collected articles: 0"
          fi
          if [ -f filtered-articles.json ]; then
            if jq -e . filtered-articles.json >/dev/null 2>&1; then
              echo "Filtered articles (score >= 40): $(cat filtered-articles.json | jq length)"
            else
              echo "Filtered articles: (filtered-articles.json is invalid JSON)"
            fi
          else
            echo "Filtered articles: (filtered-articles.json not found)"
          fi
